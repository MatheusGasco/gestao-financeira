server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gestao_financeira;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

brapi:
  base-url: https://brapi.dev/api
  token: ${BRAPI_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email:
    verification-expiration-hours: 24
    show-verification-link: false

google:
  client-id: ${GOOGLE_CLIENT_ID:}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:FinanTrack}
